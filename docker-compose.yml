services:
  forum:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - forum_data:/app/data
      - forum_uploads:/app/uploads
      - forum_certs:/app/certs
    environment:
      FORUM_BASE_URL: "http://localhost:8080"
      FORUM_DB_DRIVER: sqlite
      FORUM_DB_PATH: /app/data/forum.db
      FORUM_UPLOAD_PATH: /app/uploads
      FORUM_SESSION_SECRET: "change-me-in-production"
      FORUM_TLS_MODE: none
      FORUM_LOG_FORMAT: json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  forum_data:
  forum_uploads:
  forum_certs:
