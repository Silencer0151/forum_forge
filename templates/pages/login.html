{{define "content"}}
<div class="ff-page-header">
    <h1 class="ff-page-header__title">Log In</h1>
    <p class="ff-page-header__sub">Sign in to your ForumForge account.</p>
</div>

<div class="ff-card" style="max-width: 480px;">
    {{if .Error}}
    <div class="ff-input-error" role="alert" style="margin-bottom: var(--ff-sp-2);">{{.Error}}</div>
    {{end}}

    <form method="post" action="/auth/login" novalidate>
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        {{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}

        <div class="ff-form-group">
            <label class="ff-label" for="email">Email</label>
            <input class="ff-input" type="email" id="email" name="email" value="{{.Email}}" required autocomplete="email" autofocus>
        </div>

        <div class="ff-form-group">
            <label class="ff-label" for="password">Password</label>
            <input class="ff-input" type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <div class="ff-form-actions">
            <button class="ff-btn ff-btn--primary" type="submit">Log In</button>
            <a class="ff-btn ff-btn--ghost" href="/auth/register">Create account</a>
        </div>
    </form>

    <p class="ff-text-muted" style="margin-top: var(--ff-sp-3);">
        <a href="/auth/forgot-password">Forgot password?</a>
    </p>
</div>
{{end}}
