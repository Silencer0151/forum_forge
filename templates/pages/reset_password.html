{{define "content"}}
<div class="ff-page-header">
    <h1 class="ff-page-header__title">Set a New Password</h1>
    <p class="ff-page-header__sub">Choose a strong password — at least 8 characters.</p>
</div>

<div class="ff-card" style="max-width: 480px;">
    {{if .Error}}
    <div class="ff-input-error" role="alert" style="margin-bottom: var(--ff-sp-2);">{{.Error}}</div>
    {{end}}

    <form method="post" action="/auth/reset-password" novalidate>
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <input type="hidden" name="token" value="{{.Token}}">

        <div class="ff-form-group">
            <label class="ff-label" for="password">New password</label>
            <input class="ff-input" type="password" id="password" name="password"
                   required autocomplete="new-password" minlength="8" autofocus>
        </div>

        <div class="ff-form-group">
            <label class="ff-label" for="password_confirm">Confirm new password</label>
            <input class="ff-input" type="password" id="password_confirm" name="password_confirm"
                   required autocomplete="new-password" minlength="8">
        </div>

        <div class="ff-form-actions">
            <button class="ff-btn ff-btn--primary" type="submit">Reset password</button>
        </div>
    </form>
</div>
{{end}}
