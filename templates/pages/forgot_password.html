{{define "content"}}
<div class="ff-page-header">
    <h1 class="ff-page-header__title">Forgot Password</h1>
    <p class="ff-page-header__sub">Enter your email and we'll send you a reset link.</p>
</div>

<div class="ff-card" style="max-width: 480px;">
    {{if .Submitted}}
    <p>If an account exists for <strong>{{.Email}}</strong>, a password-reset link has been sent.
       The link expires in one hour.</p>
    <p class="ff-text-muted" style="margin-top: var(--ff-sp-2);">
        <a href="/auth/login">Back to log in</a>
    </p>
    {{else}}
    <form method="post" action="/auth/forgot-password" novalidate>
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        <div class="ff-form-group">
            <label class="ff-label" for="email">Email</label>
            <input class="ff-input" type="email" id="email" name="email" value="{{.Email}}"
                   required autocomplete="email" autofocus>
        </div>

        <div class="ff-form-actions">
            <button class="ff-btn ff-btn--primary" type="submit">Send reset link</button>
            <a class="ff-btn ff-btn--ghost" href="/auth/login">Cancel</a>
        </div>
    </form>
    {{end}}
</div>
{{end}}
