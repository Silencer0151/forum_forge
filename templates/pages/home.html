{{define "content"}}

    <h1 class="ff-page-header__title">Forum Index</h1>
    <p class="ff-page-header__sub">Browse discussions and join the conversation.</p>
</div>

{{if .Sections}}
    {{range .Sections}}
    {{template "category_card" .}}

</div>
{{end}}
{{end}}
