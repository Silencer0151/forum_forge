{{define "post_form"}}
<div class="ff-card" id="post-form-card"
     x-data="{attachmentPreviews: []}"
     x-init="(function(){
         var ta = document.getElementById('reply-body');
         if (ta && !ta.value.trim()) {
             var saved = localStorage.getItem('ff_draft_thread_{{.Thread.ID}}');
             if (saved) ta.value = saved;
         }
     })()"
     @htmx:after-request.window="
         if($event.detail.successful && $event.detail.elt && $event.detail.elt.closest('#post-form-card')){
             // Reset every field by hand so the textarea and file input both
             // empty out — form.reset() restores defaults, which would
             // re-load any quote/draft body that was the textarea's initial
             // value when this partial was rendered.
             var ta = document.getElementById('reply-body');
             if(ta){ ta.value = ''; }
             var fi = document.getElementById('attachments');
             if(fi){ fi.value = ''; }
             attachmentPreviews = [];
             localStorage.removeItem('ff_draft_thread_{{.Thread.ID}}');
         }
     ">
    <div class="ff-card__header">
        <h3 class="ff-card__title">Post a Reply</h3>
    </div>
    <div class="ff-card__body">
        <form method="POST" action="/t/{{.Thread.ID}}/reply"
              enctype="multipart/form-data"
              hx-post="/t/{{.Thread.ID}}/reply"
              hx-target="#post-list"
              hx-swap="beforeend"
              hx-encoding="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <input type="hidden" name="thread_id" value="{{.Thread.ID}}">

            <div class="ff-form-group">
                <label class="ff-label" for="body_format">Format</label>
                <select class="ff-select" id="body_format" name="body_format">
                    <option value="markdown"{{if eq .FormFormat "markdown"}} selected{{end}}>Markdown</option>
                    <option value="plaintext"{{if eq .FormFormat "plaintext"}} selected{{end}}>Plain Text</option>
                    <option value="bbcode"{{if eq .FormFormat "bbcode"}} selected{{end}}>BBCode</option>
                </select>
            </div>

            <div class="ff-form-group">
                <label class="ff-label" for="reply-body">Reply</label>
                <textarea class="ff-textarea"
                          id="reply-body"
                          name="body"
                          rows="8"
                          placeholder="Write your reply here..."
                          required
                          hx-post="/drafts"
                          hx-trigger="keyup changed delay:2s"
                          hx-include="closest form"
                          hx-swap="none"
                          @input="localStorage.setItem('ff_draft_thread_{{.Thread.ID}}', $el.value)"
                          >{{if .DraftBody}}{{.DraftBody}}{{else if .QuoteText}}{{.QuoteText}}{{end}}</textarea>
            </div>

            <div class="ff-form-group">
                <label class="ff-label" for="attachments">Attachments <span class="ff-text-muted">(optional, max 5)</span></label>
                <input type="file"
                       class="ff-input"
                       id="attachments"
                       name="attachments"
                       multiple
                       accept="image/jpeg,image/png,image/gif,image/webp,application/pdf,application/zip"
                       @change="
                           attachmentPreviews = [];
                           Array.from($event.target.files).slice(0, 5).forEach(function(file) {
                               if (file.type.startsWith('image/')) {
                                   var reader = new FileReader();
                                   reader.onload = function(e) {
                                       attachmentPreviews.push({name: file.name, src: e.target.result, isImage: true});
                                   };
                                   reader.readAsDataURL(file);
                               } else {
                                   attachmentPreviews.push({name: file.name, src: null, isImage: false});
                               }
                           });
                       ">
                <p class="ff-text-muted" style="font-size:0.8rem;margin-top:0.25rem">Allowed: JPEG, PNG, GIF, WebP, PDF, ZIP &mdash; max 5 MB each</p>

                <div x-show="attachmentPreviews.length > 0" class="ff-attachment-previews">
                    <template x-for="(p, i) in attachmentPreviews" :key="i">
                        <div class="ff-attachment-preview">
                            <img x-show="p.isImage" :src="p.src" :alt="p.name"
                                 class="ff-attachment-preview__thumb" loading="lazy">
                            <span x-show="!p.isImage" class="ff-attachment-preview__icon">&#128196;</span>
                            <span class="ff-attachment-preview__name" x-text="p.name"></span>
                        </div>
                    </template>
                </div>
            </div>

            <div class="ff-form-actions">
                <button type="submit" class="ff-btn ff-btn--primary">Post Reply</button>
                <a href="/c/{{.Category.Slug}}/{{.Subcategory.Slug}}" class="ff-btn ff-btn--ghost">Back to thread list</a>
            </div>
        </form>
    </div>
</div>
{{end}}
