{{define "pagination"}}
{{if gt .TotalPages 1}}
<nav class="ff-pagination" aria-label="Pagination">
    {{if .HasPrev}}
    <a class="ff-pagination__link" href="{{.BaseURL}}?page={{.PrevPage}}" aria-label="Previous page">&laquo;</a>
    {{end}}
    {{range .Pages}}
    <a class="ff-pagination__link{{if eq . $.CurrentPage}} ff-pagination__link--active{{end}}"
       href="{{$.BaseURL}}?page={{.}}"
       {{if eq . $.CurrentPage}}aria-current="page"{{end}}>{{.}}</a>
    {{end}}
    {{if .HasNext}}
    <a class="ff-pagination__link" href="{{.BaseURL}}?page={{.NextPage}}" aria-label="Next page">&raquo;</a>
    {{end}}
</nav>
{{end}}
{{end}}
